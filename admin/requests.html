<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1C2B84" />
  <meta name="description" content="طلبات الاشتراك — منصة أ/ إسماعيل عماد" />
  <meta name="robots" content="noindex, nofollow" />

  <title>طلبات الاشتراك — لوحة التحكم</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&family=Inter:wght@500;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Project Styles -->
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/icons.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/layout.css" />

  <style>
    /* =========================================================
       PAGE BASE
       ========================================================= */
    .adm-page {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--color-surface-soft);
      padding-bottom: calc(var(--safe-bottom) + 90px);
    }

    /* =========================================================
       HEADER
       ========================================================= */
    .adm-header {
      position: sticky;
      top: 0;
      z-index: 50;
      padding: calc(var(--safe-top) + 14px) 16px 14px;
      background: var(--color-dark-section);
      color: #FFFFFF;
    }

    .adm-header-inner {
      max-width: 900px;
      margin-inline: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .adm-back-btn {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.12);
      text-decoration: none;
      font-size: 16px;
      transition: background-color 0.15s ease;
    }

    .adm-back-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .adm-header-brand {
      flex: 1;
      min-width: 0;
    }

    .adm-header-title {
      margin: 0;
      font-size: 18px;
      font-weight: 900;
      color: #FFFFFF;
      line-height: 1.3;
    }

    .adm-header-sub {
      margin: 3px 0 0;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.7);
    }

    .adm-header-btn {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.12);
      cursor: pointer;
      font-size: 18px;
      transition: background-color 0.15s ease;
    }

    .adm-header-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* =========================================================
       CONTENT
       ========================================================= */
    .adm-content {
      max-width: 900px;
      margin-inline: auto;
      padding: 16px;
    }

    /* =========================================================
       STATS
       ========================================================= */
    .req-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .req-stat {
      padding: 12px 10px;
      border-radius: 14px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      text-align: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
      cursor: pointer;
      transition: border-color 0.15s ease, transform 0.12s ease;
    }

    .req-stat:hover {
      border-color: rgba(122, 79, 224, 0.4);
      transform: translateY(-1px);
    }

    .req-stat.is-active {
      border-color: var(--color-purple-dark);
      background: var(--color-purple-light);
    }

    .req-stat-value {
      font-family: "Inter", sans-serif;
      font-size: 20px;
      font-weight: 900;
      color: var(--color-text);
      direction: ltr;
      line-height: 1.2;
    }

    .req-stat-value.is-yellow { color: var(--color-yellow-dark); }
    .req-stat-value.is-blue   { color: var(--color-blue); }
    .req-stat-value.is-green  { color: var(--color-green); }

    .req-stat-label {
      margin-top: 2px;
      font-size: 10px;
      font-weight: 700;
      color: var(--color-text-muted);
      line-height: 1.3;
    }

    /* =========================================================
       TOOLBAR
       ========================================================= */
    .req-toolbar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    .req-search {
      position: relative;
    }

    .req-search input {
      width: 100%;
      min-height: 46px;
      padding: 0 42px 0 14px;
      border-radius: 14px;
      border: 1.5px solid var(--color-border);
      background: var(--color-surface);
      font-family: var(--font-arabic);
      font-size: 14px;
      font-weight: 500;
      color: var(--color-text);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .req-search input::placeholder {
      color: var(--color-text-muted);
      opacity: 0.7;
    }

    .req-search input:focus {
      outline: none;
      border-color: var(--color-purple-dark);
      box-shadow: 0 0 0 3px rgba(122, 79, 224, 0.12);
    }

    .req-search-icon {
      position: absolute;
      top: 50%;
      inset-inline-start: 14px;
      transform: translateY(-50%);
      font-size: 16px;
      color: var(--color-text-muted);
      pointer-events: none;
    }

    /* =========================================================
       LIST
       ========================================================= */
    .req-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* =========================================================
       REQUEST CARD
       ========================================================= */
    .req-card {
      padding: 14px;
      border-radius: 16px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
      transition: border-color 0.15s ease;
    }

    .req-card:hover {
      border-color: rgba(122, 79, 224, 0.3);
    }

    .req-card.is-pending {
      border-inline-start: 4px solid var(--color-yellow);
    }

    .req-card-head {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }

    .req-avatar {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--color-yellow);
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .req-card-body {
      flex: 1;
      min-width: 0;
    }

    .req-name {
      margin: 0 0 3px;
      font-size: 14px;
      font-weight: 800;
      color: var(--color-text);
      line-height: 1.35;
      word-break: break-word;
    }

    .req-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--color-text-muted);
    }

    .req-meta-item {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    /* Status Badge */
    .req-status {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }

    .req-status--pending   { background: var(--color-yellow-light); color: var(--color-yellow-dark); }
    .req-status--contacted { background: var(--color-blue-light);   color: var(--color-blue-dark); }
    .req-status--approved  { background: var(--color-green-light);  color: var(--color-green-dark); }
    .req-status--rejected  { background: var(--color-red-light);    color: var(--color-red-dark); }
    .req-status--completed { background: var(--color-purple-light); color: var(--color-purple-dark); }

    /* Actions */
    .req-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      padding-top: 10px;
      border-top: 1px solid var(--color-border);
    }

    .req-action-btn {
      flex: 1;
      min-width: 100px;
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border-radius: 10px;
      border: 1.5px solid var(--color-border);
      background: var(--color-surface);
      font-family: var(--font-arabic);
      font-size: 12px;
      font-weight: 700;
      color: var(--color-text);
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .req-action-btn:hover {
      background: var(--color-surface-soft);
    }

    .req-action-btn--phone {
      background: rgba(28, 123, 196, 0.08);
      border-color: rgba(28, 123, 196, 0.3);
      color: var(--color-blue-dark);
      text-decoration: none;
    }

    .req-action-btn--phone:hover {
      background: rgba(28, 123, 196, 0.15);
    }

    /* =========================================================
       STATES
       ========================================================= */
    .adm-state {
      padding: 44px 20px;
      text-align: center;
      border-radius: 16px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
    }

    .adm-state-icon {
      font-size: 40px;
      margin-bottom: 10px;
      line-height: 1;
    }

    .adm-state-title {
      margin: 0 0 6px;
      font-size: 15px;
      font-weight: 800;
      color: var(--color-text);
      line-height: 1.4;
    }

    .adm-state-text {
      margin: 0;
      font-size: 12px;
      font-weight: 500;
      color: var(--color-text-muted);
      line-height: 1.6;
    }

    /* Skeleton */
    .adm-skeleton {
      height: 130px;
      border-radius: 16px;
      background: linear-gradient(
        90deg,
        var(--color-border) 25%,
        var(--color-border) 50%,
        var(--color-border) 75%
      );
      background-size: 200% 100%;
      animation: adm-shimmer 1.4s ease-in-out infinite;
    }

    @keyframes adm-shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* =========================================================
       BOTTOM NAV
       ========================================================= */
    .adm-bottom-nav {
      position: fixed;
      bottom: 0;
      inset-inline: 0;
      z-index: 60;
      display: flex;
      align-items: stretch;
      height: 72px;
      padding-bottom: var(--safe-bottom);
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.04);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .adm-bottom-nav::-webkit-scrollbar {
      display: none;
    }

    .adm-nav-item {
      flex: 1 0 auto;
      min-width: 72px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 8px 6px;
      text-decoration: none;
      font-size: 10px;
      font-weight: 700;
      color: var(--color-text-muted);
      transition: color 0.15s ease;
    }

    .adm-nav-item:hover {
      color: var(--color-text);
    }

    .adm-nav-item.is-active {
      color: var(--color-purple-dark);
    }

    .adm-nav-icon {
      font-size: 18px;
      line-height: 1;
    }

    /* =========================================================
       MODAL (تغيير الحالة)
       ========================================================= */
    .adm-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.55);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    .adm-modal-overlay.is-open {
      opacity: 1;
      visibility: visible;
    }

    .adm-modal {
      width: 100%;
      max-width: 440px;
      max-height: 88vh;
      overflow-y: auto;
      background: var(--color-surface);
      border-radius: 20px;
      padding: 22px 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
      transform: scale(0.95);
      transition: transform 0.2s ease;
    }

    .adm-modal-overlay.is-open .adm-modal {
      transform: scale(1);
    }

    .adm-modal-title {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: 900;
      color: var(--color-text);
      text-align: center;
    }

    .adm-modal-sub {
      margin: 0 0 18px;
      font-size: 12px;
      font-weight: 500;
      color: var(--color-text-muted);
      text-align: center;
      line-height: 1.6;
    }

    .adm-modal-group {
      margin-bottom: 14px;
    }

    .adm-modal-label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
      color: var(--color-text);
    }

    .adm-modal-select,
    .adm-modal-input {
      width: 100%;
      min-height: 46px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1.5px solid var(--color-border);
      background: var(--color-bg);
      font-family: var(--font-arabic);
      font-size: 14px;
      font-weight: 500;
      color: var(--color-text);
    }

    .adm-modal-select:focus,
    .adm-modal-input:focus {
      outline: none;
      border-color: var(--color-purple-dark);
      box-shadow: 0 0 0 3px rgba(122, 79, 224, 0.12);
    }

    .adm-modal-textarea {
      width: 100%;
      min-height: 80px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--color-border);
      background: var(--color-bg);
      font-family: var(--font-arabic);
      font-size: 13px;
      font-weight: 500;
      color: var(--color-text);
      resize: vertical;
    }

    .adm-modal-textarea:focus {
      outline: none;
      border-color: var(--color-purple-dark);
      box-shadow: 0 0 0 3px rgba(122, 79, 224, 0.12);
    }

    .adm-modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .adm-modal-btn {
      flex: 1;
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      font-family: var(--font-arabic);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      border: none;
      transition: transform 0.12s ease;
    }

    .adm-modal-btn--cancel {
      background: var(--color-surface-soft);
      color: var(--color-text);
      border: 1px solid var(--color-border);
    }

    .adm-modal-btn--primary {
      background: var(--color-purple);
      color: #FFFFFF;
      box-shadow: 0 3px 0 var(--color-purple-dark);
    }

    .adm-modal-btn--primary:active {
      transform: translateY(3px);
      box-shadow: 0 0 0 var(--color-purple-dark);
    }

    .adm-modal-btn--primary:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    /* =========================================================
       RESPONSIVE
       ========================================================= */
    @media (min-width: 700px) {
      .adm-content {
        padding: 20px;
      }
    }

    @media (max-width: 480px) {
      .req-stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .req-card,
      .req-stat,
      .req-action-btn,
      .adm-modal-overlay,
      .adm-modal {
        transition: none;
      }
      .adm-skeleton {
        animation: none;
      }
    }
  </style>
  <link rel="stylesheet" href="../css/screens.css" />
  <link rel="stylesheet" href="../css/editorial-redesign.css" />
</head>

<body>

  <div class="adm-page">

    <!-- ============================================================
         HEADER
         ============================================================ -->
    <header class="adm-header">
      <div class="adm-header-inner">

        <a href="index.html" class="adm-back-btn" aria-label="رجوع">
          <span class="icon icon-arrow-forward" aria-hidden="true"></span>
        </a>

        <div class="adm-header-brand">
          <h1 class="adm-header-title">طلبات الاشتراك</h1>
          <p class="adm-header-sub" id="requestsHeaderSub">إدارة طلبات الطلاب</p>
        </div>

        <button
          type="button"
          class="adm-header-btn"
          id="requestsRefreshBtn"
          title="تحديث"
          aria-label="تحديث"
        >
          <span class="icon icon-refresh" aria-hidden="true"></span>
        </button>

      </div>
    </header>

    <!-- ============================================================
         CONTENT
         ============================================================ -->
    <main class="adm-content">

      <!-- Stats -->
      <section class="req-stats" id="reqStats">
        <div class="req-stat is-active" data-status="all">
          <div class="req-stat-value" id="statReqAll">0</div>
          <div class="req-stat-label">الكل</div>
        </div>
        <div class="req-stat" data-status="pending">
          <div class="req-stat-value is-yellow" id="statReqPending">0</div>
          <div class="req-stat-label">جديد</div>
        </div>
        <div class="req-stat" data-status="contacted">
          <div class="req-stat-value is-blue" id="statReqContacted">0</div>
          <div class="req-stat-label">تم التواصل</div>
        </div>
        <div class="req-stat" data-status="completed">
          <div class="req-stat-value is-green" id="statReqCompleted">0</div>
          <div class="req-stat-label">مكتمل</div>
        </div>
      </section>

      <!-- Toolbar -->
      <section class="req-toolbar">

        <div class="req-search">
          <span class="req-search-icon" aria-hidden="true"><span class="icon icon-search" aria-hidden="true"></span></span>
          <input
            type="text"
            id="requestsSearchInput"
            placeholder="ابحث بالاسم أو رقم الهاتف..."
            inputmode="text"
            spellcheck="false"
            autocomplete="off"
          />
        </div>

      </section>

      <!-- States -->
      <div id="requestsSkeleton">
        <div class="req-list">
          <div class="adm-skeleton"></div>
          <div class="adm-skeleton"></div>
          <div class="adm-skeleton"></div>
        </div>
      </div>

      <div class="adm-state" id="requestsEmpty" style="display: none;">
        <div class="adm-state-icon" aria-hidden="true"><span class="icon icon-mail-in" aria-hidden="true"></span></div>
        <h3 class="adm-state-title">لا توجد طلبات</h3>
        <p class="adm-state-text">ستظهر هنا طلبات الاشتراك الجديدة من الطلاب.</p>
      </div>

      <div class="adm-state" id="requestsError" style="display: none;">
        <div class="adm-state-icon" aria-hidden="true"><span class="icon icon-warning" aria-hidden="true"></span></div>
        <h3 class="adm-state-title">تعذر تحميل الطلبات</h3>
        <p class="adm-state-text">تأكد من الاتصال بالإنترنت وحاول مرة أخرى.</p>
        <button
          type="button"
          id="requestsRetryBtn"
          style="
            margin-top: 14px;
            min-height: 42px;
            padding: 0 20px;
            border-radius: 12px;
            background: var(--color-purple);
            color: #FFFFFF;
            font-family: var(--font-arabic);
            font-size: 13px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            box-shadow: 0 3px 0 var(--color-purple-dark);
          "
        >
          حاول مرة أخرى
        </button>
      </div>

      <!-- List -->
      <div class="req-list" id="requestsList" style="display: none;"></div>

    </main>

    <!-- ============================================================
         MODAL — تغيير الحالة
         ============================================================ -->
    <div
      class="adm-modal-overlay"
      id="statusModal"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
      aria-labelledby="statusModalTitle"
    >
      <div class="adm-modal">

        <h2 class="adm-modal-title" id="statusModalTitle">تحديث حالة الطلب</h2>
        <p class="adm-modal-sub" id="statusModalSub">—</p>

        <div class="adm-modal-group">
          <label class="adm-modal-label" for="statusSelect">الحالة الجديدة</label>
          <select class="adm-modal-select" id="statusSelect">
            <option value="pending">جديد</option>
            <option value="contacted">تم التواصل</option>
            <option value="approved">تمت الموافقة</option>
            <option value="rejected">مرفوض</option>
            <option value="completed">مكتمل</option>
          </select>
        </div>

        <div class="adm-modal-group">
          <label class="adm-modal-label" for="statusNote">ملاحظة (اختياري)</label>
          <textarea
            class="adm-modal-textarea"
            id="statusNote"
            placeholder="ملاحظة داخلية عن الطلب..."
            maxlength="500"
          ></textarea>
        </div>

        <div class="adm-modal-actions">
          <button
            type="button"
            class="adm-modal-btn adm-modal-btn--cancel"
            id="statusCancelBtn"
          >
            إلغاء
          </button>
          <button
            type="button"
            class="adm-modal-btn adm-modal-btn--primary"
            id="statusConfirmBtn"
          >
            حفظ
          </button>
        </div>

      </div>
    </div>

    <!-- ============================================================
         BOTTOM NAV (Admin)
         ============================================================ -->
    <nav class="adm-bottom-nav" aria-label="التنقل الإداري">

      <a href="index.html" class="adm-nav-item">
        <span class="adm-nav-icon" aria-hidden="true"><span class="icon icon-home" aria-hidden="true"></span></span>
        <span>الرئيسية</span>
      </a>

      <a href="students.html" class="adm-nav-item">
        <span class="adm-nav-icon" aria-hidden="true"><span class="icon icon-users" aria-hidden="true"></span></span>
        <span>الطلاب</span>
      </a>
