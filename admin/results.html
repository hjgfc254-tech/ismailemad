<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1C2B84" />
  <meta name="description" content="نتائج الاختبارات — منصة أ/ إسماعيل عماد" />
  <meta name="robots" content="noindex, nofollow" />

  <title>النتائج — لوحة التحكم</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&family=Inter:wght@500;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Project Styles -->
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/icons.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/layout.css" />

  <style>
    /* =========================================================
       PAGE BASE
       ========================================================= */
    .adm-page {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--color-surface-soft);
      padding-bottom: calc(var(--safe-bottom) + 90px);
    }

    /* =========================================================
       HEADER
       ========================================================= */
    .adm-header {
      position: sticky;
      top: 0;
      z-index: 50;
      padding: calc(var(--safe-top) + 14px) 16px 14px;
      background: var(--color-dark-section);
      color: #FFFFFF;
    }

    .adm-header-inner {
      max-width: 900px;
      margin-inline: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .adm-back-btn {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.12);
      text-decoration: none;
      font-size: 16px;
      transition: background-color 0.15s ease;
    }
    .adm-back-btn:hover { background: rgba(255, 255, 255, 0.15); }

    .adm-header-brand { flex: 1; min-width: 0; }

    .adm-header-title {
      margin: 0;
      font-size: 18px;
      font-weight: 900;
      color: #FFFFFF;
      line-height: 1.3;
    }

    .adm-header-sub {
      margin: 3px 0 0;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.7);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .adm-header-btn {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.12);
      cursor: pointer;
      font-size: 18px;
      transition: background-color 0.15s ease;
    }
    .adm-header-btn:hover { background: rgba(255, 255, 255, 0.15); }

    /* =========================================================
       CONTENT
       ========================================================= */
    .adm-content {
      max-width: 900px;
      margin-inline: auto;
      padding: 16px;
    }

    /* =========================================================
       FILTER INFO BANNER
       ========================================================= */
    .rs-filter-info {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      margin-bottom: 14px;
      border-radius: 14px;
      background: rgba(28, 123, 196, 0.08);
      border: 1px solid rgba(28, 123, 196, 0.2);
      font-size: 12px;
      font-weight: 600;
      color: var(--color-blue-dark);
      line-height: 1.5;
    }

    .rs-filter-info.is-hidden { display: none; }

    .rs-filter-info-icon {
      flex-shrink: 0;
      font-size: 16px;
    }

    .rs-filter-info-text {
      flex: 1;
      min-width: 0;
    }

    .rs-filter-info-clear {
      flex-shrink: 0;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(28, 123, 196, 0.15);
      color: var(--color-blue-dark);
      border: none;
      font-family: var(--font-arabic);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .rs-filter-info-clear:hover {
      background: rgba(28, 123, 196, 0.25);
    }

    /* =========================================================
       STATS
       ========================================================= */
    .rs-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .rs-stat {
      padding: 12px 10px;
      border-radius: 14px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      text-align: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
    }

    .rs-stat-value {
      font-family: "Inter", sans-serif;
      font-size: 20px;
      font-weight: 900;
      color: var(--color-text);
      direction: ltr;
      line-height: 1.2;
    }

    .rs-stat-value.is-green  { color: var(--color-green); }
    .rs-stat-value.is-blue   { color: var(--color-blue); }
    .rs-stat-value.is-yellow { color: var(--color-yellow-dark); }
    .rs-stat-value.is-purple { color: var(--color-purple); }

    .rs-stat-label {
      margin-top: 2px;
      font-size: 10px;
      font-weight: 700;
      color: var(--color-text-muted);
      line-height: 1.3;
    }

    /* =========================================================
       TOOLBAR
       ========================================================= */
    .rs-toolbar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    .rs-search {
      position: relative;
    }

    .rs-search input {
      width: 100%;
      min-height: 46px;
      padding: 0 42px 0 14px;
      border-radius: 14px;
      border: 1.5px solid var(--color-border);
      background: var(--color-surface);
      font-family: var(--font-arabic);
      font-size: 14px;
      font-weight: 500;
      color: var(--color-text);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .rs-search input::placeholder {
      color: var(--color-text-muted);
      opacity: 0.7;
    }

    .rs-search input:focus {
      outline: none;
      border-color: var(--color-red);
      box-shadow: 0 0 0 3px rgba(224, 58, 47, 0.12);
    }

    .rs-search-icon {
      position: absolute;
      top: 50%;
      inset-inline-start: 14px;
      transform: translateY(-50%);
      font-size: 16px;
      color: var(--color-text-muted);
      pointer-events: none;
    }

    .rs-filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }

    .rs-filters::-webkit-scrollbar { display: none; }

    .rs-filter {
      flex-shrink: 0;
      min-height: 38px;
      padding: 0 14px;
      border-radius: 999px;
      background: var(--color-surface);
      border: 1.5px solid var(--color-border);
      font-family: var(--font-arabic);
      font-size: 12px;
      font-weight: 700;
      color: var(--color-text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .rs-filter:hover {
      border-color: rgba(224, 58, 47, 0.35);
      color: var(--color-text);
    }

    .rs-filter.is-active {
      background: var(--color-red);
      border-color: var(--color-red);
      color: #FFFFFF;
    }

    /* =========================================================
       LIST
       ========================================================= */
    .rs-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* =========================================================
       RESULT CARD
       ========================================================= */
    .result-card {
      padding: 14px;
      border-radius: 16px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
      transition: border-color 0.15s ease;
    }

    .result-card:hover {
      border-color: rgba(224, 58, 47, 0.3);
    }

    .result-card-head {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }

    /* Score circle */
    .result-score {
      flex-shrink: 0;
      width: 60px;
      height: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--color-surface-soft);
      border: 3px solid var(--color-border);
      font-family: "Inter", sans-serif;
      direction: ltr;
      line-height: 1;
    }

    .result-score.is-pass {
      background: var(--color-green-light);
      border-color: rgba(28, 43, 132, 0.4);
    }

    .result-score.is-fail {
      background: var(--color-red-light);
      border-color: rgba(224, 58, 47, 0.4);
    }

    .result-score-value {
      font-size: 18px;
      font-weight: 900;
      color: var(--color-text);
    }

    .result-score.is-pass .result-score-value { color: var(--color-green-dark); }
    .result-score.is-fail .result-score-value { color: var(--color-red-dark); }

    .result-score-percent {
      margin-top: 2px;
      font-size: 9px;
      font-weight: 700;
      color: var(--color-text-muted);
    }

    .result-score.is-pass .result-score-percent { color: var(--color-green-dark); opacity: 0.8; }
    .result-score.is-fail .result-score-percent { color: var(--color-red-dark); opacity: 0.8; }

    /* Body */
    .result-body {
      flex: 1;
      min-width: 0;
    }

    .result-student-name {
      margin: 0 0 4px;
      font-size: 14px;
      font-weight: 800;
      color: var(--color-text);
      line-height: 1.35;
      word-break: break-word;
    }

    .result-exam-title {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--color-text-muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .result-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 11px;
      font-weight: 600;
      color: var(--color-text-muted);
    }

    .result-meta-item {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    /* Meta badges */
    .result-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .result-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }

    .result-badge--stage {
      background: var(--color-blue-light);
      color: var(--color-blue-dark);
    }

    .result-badge--visible {
      background: var(--color-green-light);
      color: var(--color-green-dark);
    }

    .result-badge--pending {
      background: var(--color-yellow-light);
      color: var(--color-yellow-dark);
    }

    /* Actions */
    .result-actions {
      display: flex;
      gap: 6px;
      padding-top: 10px;
      margin-top: 10px;
      border-top: 1px solid var(--color-border);
    }

    .result-action-btn {
      flex: 1;
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border-radius: 10px;
      border: 1.5px solid var(--color-border);
      background: var(--color-surface);
      font-family: var(--font-arabic);
      font-size: 12px;
      font-weight: 700;
      color: var(--color-text);
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .result-action-btn:hover { background: var(--color-surface-soft); }

    .result-action-btn--info {
      color: var(--color-blue-dark);
      border-color: rgba(28, 123, 196, 0.3);
    }
    .result-action-btn--info:hover { background: rgba(28, 123, 196, 0.06); }

    /* =========================================================
       STATES
       ========================================================= */
    .adm-state {
      padding: 44px 20px;
      text-align: center;
      border-radius: 16px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
    }

    .adm-state-icon { font-size: 40px; margin-bottom: 10px; line-height: 1; }

    .adm-state-title {
      margin: 0 0 6px;
      font-size: 15px;
      font-weight: 800;
      color: var(--color-text);
      line-height: 1.4;
    }

    .adm-state-text {
      margin: 0;
      font-size: 12px;
      font-weight: 500;
      color: var(--color-text-muted);
      line-height: 1.6;
    }

    /* Skeleton */
    .adm-skeleton {
      height: 130px;
      border-radius: 16px;
      background: linear-gradient(90deg, var(--color-border) 25%, var(--color-border) 50%, var(--color-border) 75%);
      background-size: 200% 100%;
      animation: adm-shimmer 1.4s ease-in-out infinite;
    }

    @keyframes adm-shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* =========================================================
       DETAILS MODAL
       ========================================================= */
    .adm-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.55);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    .adm-modal-overlay.is-open {
      opacity: 1;
      visibility: visible;
    }

    .adm-modal {
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      background: var(--color-surface);
      border-radius: 20px;
      padding: 22px 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
      transform: scale(0.95);
      transition: transform 0.2s ease;
    }

    .adm-modal-overlay.is-open .adm-modal {
      transform: scale(1);
    }

    .adm-modal-title {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: 900;
      color: var(--color-text);
      text-align: center;
    }

    .adm-modal-sub {
      margin: 0 0 18px;
      font-size: 12px;
      font-weight: 500;
      color: var(--color-text-muted);
      text-align: center;
      line-height: 1.6;
    }

    .adm-modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .adm-modal-btn {
      flex: 1;
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      font-family: var(--font-arabic);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      border: none;
    }

    .adm-modal-btn--cancel {
      background: var(--color-surface-soft);
      color: var(--color-text);
      border: 1px solid var(--color-border);
    }

    /* =========================================================
       BOTTOM NAV
       ========================================================= */
    .adm-bottom-nav {
      position: fixed;
      bottom: 0;
      inset-inline: 0;
      z-index: 60;
      display: flex;
      align-items: stretch;
      height: 72px;
      padding-bottom: var(--safe-bottom);
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.04);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .adm-bottom-nav::-webkit-scrollbar { display: none; }

    .adm-nav-item {
      flex: 1 0 auto;
      min-width: 72px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 8px 6px;
      text-decoration: none;
      font-size: 10px;
      font-weight: 700;
      color: var(--color-text-muted);
      transition: color 0.15s ease;
    }

    .adm-nav-item:hover { color: var(--color-text); }
    .adm-nav-item.is-active { color: var(--color-purple-dark); }

    .adm-nav-icon { font-size: 18px; line-height: 1; }

    /* =========================================================
       RESPONSIVE
       ========================================================= */
    @media (min-width: 700px) {
      .adm-content { padding: 20px; }
    }

    @media (max-width: 480px) {
      .rs-stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .result-card,
      .rs-filter,
      .adm-modal-overlay,
      .adm-modal {
        transition: none;
      }
      .adm-skeleton { animation: none; }
    }
  </style>
  <link rel="stylesheet" href="../css/screens.css" />
  <link rel="stylesheet" href="../css/editorial-redesign.css" />
</head>

<body>

  <div class="adm-page">

    <!-- ============================================================
         HEADER
         ============================================================ -->
    <header class="adm-header">
      <div class="adm-header-inner">

        <a href="index.html" class="adm-back-btn" aria-label="رجوع">
          <span class="icon icon-arrow-forward" aria-hidden="true"></span>
        </a>

        <div class="adm-header-brand">
          <h1 class="adm-header-title">النتائج</h1>
          <p class="adm-header-sub" id="rsHeaderSub">متابعة نتائج الطلاب</p>
        </div>

        <button
          type="button"
          class="adm-header-btn"
          id="rsRefreshBtn"
          title="تحديث"
          aria-label="تحديث"
        >
          <span class="icon icon-refresh" aria-hidden="true"></span>
        </button>

      </div>
    </header>

    <!-- ============================================================
         CONTENT
         ============================================================ -->
    <main class="adm-content">

      <!-- Filter Info Banner (لو ?examId= موجود) -->
      <div class="rs-filter-info is-hidden" id="rsFilterInfo">
        <span class="rs-filter-info-icon" aria-hidden="true"><span class="icon icon-target" aria-hidden="true"></span></span>
        <span class="rs-filter-info-text" id="rsFilterInfoText">—</span>
        <button type="button" class="rs-filter-info-clear" id="rsFilterInfoClearBtn">
          إزالة الفلتر
        </button>
      </div>

      <!-- Stats -->
      <section class="rs-stats" id="rsStats">
        <div class="rs-stat">
          <div class="rs-stat-value" id="statRsAll">0</div>
          <div class="rs-stat-label">محاولة</div>
        </div>
        <div class="rs-stat">
          <div class="rs-stat-value is-green" id="statRsAvg">0%</div>
          <div class="rs-stat-label">متوسط</div>
        </div>
        <div class="rs-stat">
          <div class="rs-stat-value is-blue" id="statRsTop">0</div>
          <div class="rs-stat-label">أعلى درجة</div>
        </div>
        <div class="rs-stat">
          <div class="rs-stat-value is-yellow" id="statRsPass">0</div>
          <div class="rs-stat-label">ناجح</div>
        </div>
      </section>

      <!-- Toolbar -->
      <section class="rs-toolbar">

        <div class="rs-search">
          <span class="rs-search-icon" aria-hidden="true"><span class="icon icon-search" aria-hidden="true"></span></span>
          <input
            type="text"
            id="rsSearchInput"
            placeholder="ابحث باسم الطالب أو الاختبار..."
            inputmode="text"
            spellcheck="false"
            autocomplete="off"
          />
        </div>

        <div class="rs-filters" id="rsFilters">
          <button type="button" class="rs-filter is-active" data-filter="all">
            الكل
          </button>
          <button type="button" class="rs-filter" data-filter="pass">
            ناجح
          </button>
          <button type="button" class="rs-filter" data-filter="fail">
            راسب
          </button>
          <button type="button" class="rs-filter" data-filter="pending">
            قيد الانتظار
          </button>
        </div>

      </section>

      <!-- States -->
      <div id="rsSkeleton">
        <div class="rs-list">
          <div class="adm-skeleton"></div>
          <div class="adm-skeleton"></div>
          <div class="adm-skeleton"></div>
        </div>
      </div>

      <div class="adm-state" id="rsEmpty" style="display: none;">
        <div class="adm-state-icon" aria-hidden="true"><span class="icon icon-target" aria-hidden="true"></span></div>
        <h3 class="adm-state-title">لا توجد نتائج</h3>
        <p class="adm-state-text">لم يقم أي طالب بأداء الاختبارات بعد.</p>
      </div>

      <div class="adm-state" id="rsError" style="display: none;">
        <div class="adm-state-icon" aria-hidden="true"><span class="icon icon-warning" aria-hidden="true"></span></div>
        <h3 class="adm-state-title">تعذر تحميل النتائج</h3>
        <p class="adm-state-text">تأكد من الاتصال بالإنترنت وحاول مرة أخرى.</p>
        <button
          type="button"
          id="rsRetryBtn"
          style="
            margin-top: 14px;
            min-height: 42px;
            padding: 0 20px;
            border-radius: 12px;
            background: var(--color-red);
            color: #FFFFFF;
            font-family: var(--font-arabic);
            font-size: 13px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            box-shadow: 0 3px 0 #D63A3A;
          "
        >
          حاول مرة أخرى
        </button>
      </div>

      <!-- List -->
      <div class="rs-list" id="rsList" style="display: none;"></div>

    </main>

    <!-- ============================================================
         DETAILS MODAL
         ============================================================ -->
    <div
      class="adm-modal-overlay"
      id="rsDetailsModal"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
      aria-labelledby="rsDetailsTitle"
    >
      <div class="adm-modal">

        <h2 class="adm-modal-title" id="rsDetailsTitle">تفاصيل المحاولة</h2>
        <p class="adm-modal-sub" id="rsDetailsSub">—</p>

        <div id="rsDetailsContent">
          <!-- يتم تعبئتها من JS -->
        </div>

        <div class="adm-modal-actions">
          <button
