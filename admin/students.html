<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1C2B84" />
  <meta name="description" content="إدارة الطلاب — منصة أ/ إسماعيل عماد" />
  <meta name="robots" content="noindex, nofollow" />

  <title>الطلاب — لوحة التحكم</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&family=Inter:wght@500;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Project Styles -->
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/icons.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/layout.css" />

  <style>
    /* =========================================================
       PAGE BASE
       ========================================================= */
    .adm-page {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--color-surface-soft);
      padding-bottom: calc(var(--safe-bottom) + 90px);
    }

    /* =========================================================
       HEADER
       ========================================================= */
    .adm-header {
      position: sticky;
      top: 0;
      z-index: 50;
      padding: calc(var(--safe-top) + 14px) 16px 14px;
      background: var(--color-dark-section);
      color: #FFFFFF;
    }

    .adm-header-inner {
      max-width: 900px;
      margin-inline: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .adm-back-btn {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.12);
      text-decoration: none;
      font-size: 16px;
      transition: background-color 0.15s ease;
    }

    .adm-back-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .adm-header-brand {
      flex: 1;
      min-width: 0;
    }

    .adm-header-title {
      margin: 0;
      font-size: 18px;
      font-weight: 900;
      color: #FFFFFF;
      line-height: 1.3;
    }

    .adm-header-sub {
      margin: 3px 0 0;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.7);
    }

    .adm-header-btn {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.12);
      cursor: pointer;
      font-size: 18px;
      transition: background-color 0.15s ease;
    }

    .adm-header-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* =========================================================
       CONTENT
       ========================================================= */
    .adm-content {
      max-width: 900px;
      margin-inline: auto;
      padding: 16px;
    }

    /* =========================================================
       STATS
       ========================================================= */
    .students-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .students-stat {
      padding: 12px 10px;
      border-radius: 14px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      text-align: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
    }

    .students-stat-value {
      font-family: "Inter", sans-serif;
      font-size: 20px;
      font-weight: 900;
      color: var(--color-text);
      direction: ltr;
      line-height: 1.2;
    }

    .students-stat-value.is-blue   { color: var(--color-blue); }
    .students-stat-value.is-green  { color: var(--color-green); }
    .students-stat-value.is-purple { color: var(--color-purple); }
    .students-stat-value.is-yellow { color: var(--color-yellow-dark); }

    .students-stat-label {
      margin-top: 2px;
      font-size: 10px;
      font-weight: 700;
      color: var(--color-text-muted);
      line-height: 1.3;
    }

    /* =========================================================
       TOOLBAR
       ========================================================= */
    .students-toolbar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    .students-search {
      position: relative;
    }

    .students-search input {
      width: 100%;
      min-height: 46px;
      padding: 0 42px 0 14px;
      border-radius: 14px;
      border: 1.5px solid var(--color-border);
      background: var(--color-surface);
      font-family: var(--font-arabic);
      font-size: 14px;
      font-weight: 500;
      color: var(--color-text);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .students-search input::placeholder {
      color: var(--color-text-muted);
      opacity: 0.7;
    }

    .students-search input:focus {
      outline: none;
      border-color: var(--color-purple-dark);
      box-shadow: 0 0 0 3px rgba(122, 79, 224, 0.12);
    }

    .students-search-icon {
      position: absolute;
      top: 50%;
      inset-inline-start: 14px;
      transform: translateY(-50%);
      font-size: 16px;
      color: var(--color-text-muted);
      pointer-events: none;
    }

    .students-filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }

    .students-filters::-webkit-scrollbar {
      display: none;
    }

    .students-filter {
      flex-shrink: 0;
      min-height: 38px;
      padding: 0 14px;
      border-radius: 999px;
      background: var(--color-surface);
      border: 1.5px solid var(--color-border);
      font-family: var(--font-arabic);
      font-size: 12px;
      font-weight: 700;
      color: var(--color-text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .students-filter:hover {
      border-color: rgba(122, 79, 224, 0.35);
      color: var(--color-text);
    }

    .students-filter.is-active {
      background: var(--color-purple-dark);
      border-color: var(--color-purple-dark);
      color: #FFFFFF;
    }

    /* =========================================================
       LIST
       ========================================================= */
    .students-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* =========================================================
       STUDENT CARD
       ========================================================= */
    .student-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border-radius: 16px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
      transition: border-color 0.15s ease, transform 0.15s ease;
    }

    .student-card:hover {
      border-color: rgba(122, 79, 224, 0.3);
      transform: translateY(-1px);
    }

    .student-avatar {
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--color-primary);
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .student-body {
      flex: 1;
      min-width: 0;
    }

    .student-name {
      margin: 0 0 3px;
      font-size: 14px;
      font-weight: 800;
      color: var(--color-text);
      line-height: 1.35;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .student-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--color-text-muted);
    }

    .student-meta-item {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .student-meta-item .num {
      font-family: "Inter", sans-serif;
      direction: ltr;
    }

    .student-action {
      flex-shrink: 0;
      min-height: 38px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 10px;
      background: var(--color-purple-light);
      color: var(--color-purple-dark);
      border: none;
      font-family: var(--font-arabic);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.15s ease;
    }

    .student-action:hover {
      background: rgba(122, 79, 224, 0.25);
    }

    /* =========================================================
       STATES
       ========================================================= */
    .adm-state {
      padding: 44px 20px;
      text-align: center;
      border-radius: 16px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
    }

    .adm-state-icon {
      font-size: 40px;
      margin-bottom: 10px;
      line-height: 1;
    }

    .adm-state-title {
      margin: 0 0 6px;
      font-size: 15px;
      font-weight: 800;
      color: var(--color-text);
      line-height: 1.4;
    }

    .adm-state-text {
      margin: 0;
      font-size: 12px;
      font-weight: 500;
      color: var(--color-text-muted);
      line-height: 1.6;
    }

    /* Skeleton */
    .adm-skeleton {
      height: 76px;
      border-radius: 16px;
      background: linear-gradient(
        90deg,
        var(--color-border) 25%,
        var(--color-border) 50%,
        var(--color-border) 75%
      );
      background-size: 200% 100%;
      animation: adm-shimmer 1.4s ease-in-out infinite;
    }

    @keyframes adm-shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* =========================================================
       BOTTOM NAV
       ========================================================= */
    .adm-bottom-nav {
      position: fixed;
      bottom: 0;
      inset-inline: 0;
      z-index: 60;
      display: flex;
      align-items: stretch;
      height: 72px;
      padding-bottom: var(--safe-bottom);
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.04);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .adm-bottom-nav::-webkit-scrollbar {
      display: none;
    }

    .adm-nav-item {
      flex: 1 0 auto;
      min-width: 72px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 8px 6px;
      text-decoration: none;
      font-size: 10px;
      font-weight: 700;
      color: var(--color-text-muted);
      transition: color 0.15s ease;
    }

    .adm-nav-item:hover {
      color: var(--color-text);
    }

    .adm-nav-item.is-active {
      color: var(--color-purple-dark);
    }

    .adm-nav-icon {
      font-size: 18px;
      line-height: 1;
    }

    /* =========================================================
       RESPONSIVE
       ========================================================= */
    @media (min-width: 700px) {
      .adm-content {
        padding: 20px;
      }
    }

    @media (max-width: 480px) {
      .students-stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .student-card,
      .students-filter {
        transition: none;
      }
      .adm-skeleton {
        animation: none;
      }
    }
  </style>
  <link rel="stylesheet" href="../css/screens.css" />
  <link rel="stylesheet" href="../css/editorial-redesign.css" />
</head>

<body>

  <div class="adm-page">

    <!-- ============================================================
         HEADER
         ============================================================ -->
    <header class="adm-header">
      <div class="adm-header-inner">

        <a href="index.html" class="adm-back-btn" aria-label="رجوع">
          <span class="icon icon-arrow-forward" aria-hidden="true"></span>
        </a>

        <div class="adm-header-brand">
          <h1 class="adm-header-title">الطلاب</h1>
          <p class="adm-header-sub" id="studentsHeaderSub">إدارة الطلاب المسجّلين</p>
        </div>

        <button
          type="button"
          class="adm-header-btn"
          id="studentsRefreshBtn"
          title="تحديث"
          aria-label="تحديث"
        >
          <span class="icon icon-refresh" aria-hidden="true"></span>
        </button>

      </div>
    </header>

    <!-- ============================================================
         CONTENT
         ============================================================ -->
    <main class="adm-content">

      <!-- Stats -->
      <section class="students-stats">
        <div class="students-stat">
          <div class="students-stat-value" id="statStudentsTotal">0</div>
          <div class="students-stat-label">الكل</div>
        </div>
        <div class="students-stat">
          <div class="students-stat-value is-blue" id="statStudentsPrep">0</div>
          <div class="students-stat-label">إعدادي</div>
        </div>
        <div class="students-stat">
          <div class="students-stat-value is-green" id="statStudentsSec">0</div>
          <div class="students-stat-label">ثانوي</div>
        </div>
        <div class="students-stat">
          <div class="students-stat-value is-yellow" id="statStudentsGrade">0</div>
          <div class="students-stat-label">ابتدائي</div>
        </div>
      </section>

      <!-- Toolbar -->
      <section class="students-toolbar">

        <div class="students-search">
          <span class="students-search-icon" aria-hidden="true"><span class="icon icon-search" aria-hidden="true"></span></span>
          <input
            type="text"
            id="studentsSearchInput"
            placeholder="ابحث بالاسم أو الكود..."
            inputmode="text"
            spellcheck="false"
            autocomplete="off"
          />
        </div>

        <div class="students-filters" id="studentsFilters">
          <button type="button" class="students-filter is-active" data-stage="all">
            كل المراحل
          </button>
          <button type="button" class="students-filter" data-stage="grade">ابتدائي</button>
          <button type="button" class="students-filter" data-stage="prep">إعدادي</button>
          <button type="button" class="students-filter" data-stage="sec">ثانوي</button>
        </div>

      </section>

      <!-- States -->
      <div id="studentsSkeleton">
        <div class="students-list">
          <div class="adm-skeleton"></div>
          <div class="adm-skeleton"></div>
          <div class="adm-skeleton"></div>
        </div>
      </div>

      <div class="adm-state" id="studentsEmpty" style="display: none;">
        <div class="adm-state-icon" aria-hidden="true"><span class="icon icon-users" aria-hidden="true"></span></div>
        <h3 class="adm-state-title">لا يوجد طلاب</h3>
        <p class="adm-state-text">لم يسجّل أي طالب في المنصة بعد.</p>
      </div>

      <div class="adm-state" id="studentsError" style="display: none;">
        <div class="adm-state-icon" aria-hidden="true"><span class="icon icon-warning" aria-hidden="true"></span></div>
        <h3 class="adm-state-title">تعذر تحميل الطلاب</h3>
        <p class="adm-state-text">تأكد من الاتصال بالإنترنت وحاول مرة أخرى.</p>
        <button
          type="button"
          id="studentsRetryBtn"
          style="
            margin-top: 14px;
            min-height: 42px;
            padding: 0 20px;
            border-radius: 12px;
            background: var(--color-purple);
            color: #FFFFFF;
            font-family: var(--font-arabic);
            font-size: 13px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            box-shadow: 0 3px 0 var(--color-purple-dark);
          "
        >
          حاول مرة أخرى
        </button>
      </div>

      <!-- List -->
      <div class="students-list" id="studentsList" style="display: none;"></div>

    </main>

    <!-- ============================================================
         BOTTOM NAV (Admin)
         ============================================================ -->
    <nav class="adm-bottom-nav" aria-label="التنقل الإداري">

      <a href="index.html" class="adm-nav-item">
        <span class="adm-nav-icon" aria-hidden="true"><span class="icon icon-home" aria-hidden="true"></span></span>
        <span>الرئيسية</span>
      </a>

      <a href="students.html" class="adm-nav-item is-active">
        <span class="adm-nav-icon" aria-hidden="true"><span class="icon icon-users" aria-hidden="true"></span></span>
        <span>الطلاب</span>
      </a>

      <a href="codes.html" class="adm-nav-item">
        <span class="adm-nav-icon" aria-hidden="true"><span class="icon icon-key" aria-hidden="true"></span></span>
        <span>الأكواد</span>
      </a>

      <a href="announcements.html" class="adm-nav-item">
        <span class="adm-nav-icon" aria-hidden="true"><span class="icon icon-announcement" aria-hidden="true"></span></span>
        <span>إعلانات</span>
      </a>

      <a href="exams.html" class="adm-nav-item">
        <span class="adm-nav-icon" aria-hidden="true"><span class="icon icon-exam-paper" aria-hidden="true"></span></span>
        <span>اختبارات</span>
      </a>

      <a href="settings.html" class="adm-nav-item">
        <span class="adm-nav-icon" aria-hidden="true"><span class="icon icon-settings" aria-hidden="true"></span></span>
        <span>الإعدادات</span>
      </a>

    </nav>

  </div>

  <!-- JavaScript -->
  <script type="module" src="../js/admin-students.js"></script>

</body>
</html>
