<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="var(--color-purple)" />
  <meta name="description" content="منصة أ/ إسماعيل عماد التعليمية — المساعد الذكي" />

  <title>المساعد الذكي — منصة أ/ إسماعيل عماد</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&family=Inter:wght@500;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Project Styles -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/icons.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />

  <style>
    /* =========================================================
       PAGE BASE
       ========================================================= */
    .ai-page {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--color-bg);
    }

    /* =========================================================
       HEADER
       ========================================================= */
    .ai-header {
      position: sticky;
      top: 0;
      z-index: 50;
      padding: calc(var(--safe-top) + 12px) 16px 12px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
    }

    .ai-header-inner {
      max-width: 720px;
      margin-inline: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ai-header-icon {
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: var(--color-purple-light);
      font-size: 20px;
    }

    .ai-header-meta {
      flex: 1;
      min-width: 0;
    }

    .ai-header-title {
      margin: 0;
      font-size: 16px;
      font-weight: 900;
      color: var(--color-text);
      line-height: 1.3;
    }

    .ai-header-sub {
      margin: 2px 0 0;
      font-size: 11px;
      font-weight: 600;
      color: var(--color-text-muted);
      line-height: 1.4;
    }

    .ai-new-chat-btn {
      flex-shrink: 0;
      min-height: 38px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 999px;
      background: var(--color-purple-light);
      color: var(--color-purple-dark);
      font-family: var(--font-arabic);
      font-size: 12px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .ai-new-chat-btn:hover {
      background: rgba(122, 79, 224, 0.25);
    }

    /* =========================================================
       CONVERSATION
       ========================================================= */
    .ai-conversation {
      flex: 1;
      width: 100%;
      max-width: 720px;
      margin-inline: auto;
      padding: 16px;
      padding-bottom: calc(var(--safe-bottom) + 100px);
      overflow-y: auto;
    }

    .ai-messages {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ====== Empty State ====== */
    .ai-empty {
      padding: 40px 12px;
      text-align: center;
    }

    .ai-empty-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--color-purple);
      font-size: 34px;
      box-shadow: 0 10px 28px rgba(122, 79, 224, 0.28);
    }

    .ai-empty-title {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: 900;
      color: var(--color-text);
      line-height: 1.35;
    }

    .ai-empty-text {
      margin: 0 0 22px;
      font-size: 13px;
      font-weight: 500;
      color: var(--color-text-muted);
      line-height: 1.7;
      max-width: 340px;
      margin-inline: auto;
    }

    .ai-suggestions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 380px;
      margin-inline: auto;
    }

    .ai-suggestion {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 14px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      text-align: right;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text);
      line-height: 1.5;
      transition: border-color 0.15s ease, transform 0.1s ease;
    }

    .ai-suggestion:hover {
      border-color: rgba(122, 79, 224, 0.4);
      transform: translateY(-1px);
    }

    .ai-suggestion-icon {
      flex-shrink: 0;
      font-size: 18px;
    }

    /* ====== Message Bubbles ====== */
    .ai-msg {
      display: flex;
      gap: 8px;
      max-width: 85%;
      align-items: flex-start;
    }

    .ai-msg--user {
      align-self: flex-start;
      flex-direction: row-reverse;
      margin-inline-start: auto;
    }

    .ai-msg--assistant {
      align-self: flex-end;
      margin-inline-end: auto;
    }

    .ai-msg-avatar {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 15px;
    }

    .ai-msg--user .ai-msg-avatar {
      background: var(--color-green-light);
      color: var(--color-green-dark);
    }

    .ai-msg--assistant .ai-msg-avatar {
      background: var(--color-purple);
      color: #FFFFFF;
    }

    .ai-msg-bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .ai-msg--user .ai-msg-bubble {
      background: var(--color-primary);
      color: #FFFFFF;
      border-end-start-radius: 6px;
    }

    .ai-msg--assistant .ai-msg-bubble {
      background: var(--color-surface);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      border-end-end-radius: 6px;
    }

    /* ====== Typing Indicator ====== */
    .ai-typing {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 14px 16px;
    }

    .ai-typing-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-purple-dark);
      animation: ai-typing-bounce 1.4s infinite ease-in-out;
    }

    .ai-typing-dot:nth-child(2) {
      animation-delay: 0.15s;
    }

    .ai-typing-dot:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes ai-typing-bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* ====== Error Message ====== */
    .ai-msg--error .ai-msg-bubble {
      background: var(--color-red-light);
      border-color: rgba(224, 58, 47, 0.3);
      color: var(--color-red-dark);
    }

    /* =========================================================
       INPUT AREA (Sticky Bottom)
       ========================================================= */
    .ai-input-area {
      position: fixed;
      bottom: 0;
      inset-inline: 0;
      z-index: 60;
      padding: 10px 16px calc(var(--safe-bottom) + 10px);
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.04);
    }

    .ai-input-inner {
      max-width: 720px;
      margin-inline: auto;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .ai-input {
      flex: 1;
      min-height: 44px;
      max-height: 140px;
      padding: 11px 14px;
      border-radius: 22px;
      border: 1.5px solid var(--color-border);
      background: var(--color-bg);
      font-family: var(--font-arabic);
      font-size: 14px;
      font-weight: 500;
      color: var(--color-text);
      line-height: 1.6;
      resize: none;
      overflow-y: auto;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .ai-input::placeholder {
      color: var(--color-text-muted);
      opacity: 0.7;
    }

    .ai-input:focus {
      outline: none;
      border-color: var(--color-purple);
      box-shadow: 0 0 0 3px rgba(122, 79, 224, 0.12);
    }

    .ai-send-btn {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--color-purple);
      color: #FFFFFF;
      border: none;
      cursor: pointer;
      font-size: 18px;
      box-shadow: 0 3px 0 var(--color-purple-dark);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .ai-send-btn:active {
      transform: translateY(3px);
      box-shadow: 0 0 0 var(--color-purple-dark);
    }

    .ai-send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: 0 3px 0 var(--color-purple-dark);
    }

    /* =========================================================
       RESPONSIVE
       ========================================================= */
    @media (min-width: 700px) {
      .ai-conversation {
        padding: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .ai-suggestion,
      .ai-send-btn,
      .ai-new-chat-btn {
        transition: none;
      }
      .ai-typing-dot {
        animation: none;
      }
    }
  </style>
  <link rel="stylesheet" href="css/screens.css" />
  <link rel="stylesheet" href="css/editorial-redesign.css" />
</head>

<body>

  <div class="ai-page">

    <!-- ============================================================
         HEADER
         ============================================================ -->
    <header class="ai-header">
      <div class="ai-header-inner">

        <div class="ai-header-icon" aria-hidden="true"><span class="icon icon-sparkles" aria-hidden="true"></span></div>

        <div class="ai-header-meta">
          <h1 class="ai-header-title">المساعد الذكي</h1>
          <p class="ai-header-sub" id="aiSubtitle">جاهز أساعدك في مذاكرتك</p>
        </div>

        <button
          type="button"
          class="ai-new-chat-btn"
          id="newChatBtn"
          aria-label="محادثة جديدة"
        >
          <span aria-hidden="true">＋</span>
          <span>محادثة جديدة</span>
        </button>

      </div>
    </header>

    <!-- ============================================================
         CONVERSATION
         ============================================================ -->
    <main class="ai-conversation" id="aiConversation">

      <!-- Empty State -->
      <div class="ai-empty" id="aiEmpty">
        <div class="ai-empty-icon" aria-hidden="true"><span class="icon icon-sparkles" aria-hidden="true"></span></div>
        <h2 class="ai-empty-title">مرحبًا بك في المساعد الذكي</h2>
        <p class="ai-empty-text">
          اسألني عن أي حاجة في مذاكرتك، وأنا أساعدك في فهمها.
        </p>

        <div class="ai-suggestions" id="aiSuggestions">
          <button
            type="button"
            class="ai-suggestion"
            data-suggestion="اشرح لي الدرس بطريقة بسيطة"
          >
            <span class="ai-suggestion-icon" aria-hidden="true"><span class="icon icon-idea" aria-hidden="true"></span></span>
            <span>اشرح لي الدرس بطريقة بسيطة</span>
          </button>
          <button
            type="button"
            class="ai-suggestion"
            data-suggestion="راجع معي هذا الموضوع"
          >
            <span class="ai-suggestion-icon" aria-hidden="true"><span class="icon icon-open-book" aria-hidden="true"></span></span>
            <span>راجع معي هذا الموضوع</span>
          </button>
          <button
            type="button"
            class="ai-suggestion"
            data-suggestion="ساعدني أفهم السؤال ده"
          >
            <span class="ai-suggestion-icon" aria-hidden="true"><span class="icon icon-question" aria-hidden="true"></span></span>
            <span>ساعدني أفهم السؤال ده</span>
          </button>
        </div>
      </div>

      <!-- Messages -->
      <div class="ai-messages" id="aiMessages" style="display: none;"></div>

    </main>

    <!-- ============================================================
         INPUT AREA
         ============================================================ -->
    <div class="ai-input-area">
      <div class="ai-input-inner">

        <textarea
          class="ai-input"
          id="aiInput"
          placeholder="اكتب سؤالك هنا..."
          rows="1"
          maxlength="2000"
          aria-label="اكتب سؤالك"
        ></textarea>

        <button
          type="button"
          class="ai-send-btn"
          id="aiSendBtn"
          aria-label="إرسال"
        >
          <span class="icon icon-play" aria-hidden="true"></span>
        </button>

      </div>
    </div>

  </div>

  <!-- ============================================================
       Bottom Nav Slot
       ============================================================ -->
  <div id="bottomNavSlot" style="display: none;"></div>

  <!-- JavaScript -->
  <script type="module" src="js/ai.js"></script>

</body>
</html>
