# ============================================================
# wrangler.toml
# ------------------------------------------------------------
# منصة أ/ إسماعيل عماد التعليمية
# إعدادات Cloudflare Worker
#
# المكان: /worker/wrangler.toml
#
# المرجع:
#   - الوثيقة الأصلية (بنود 143، 144)
#   - Cloudflare Workers Documentation
#
# ⚠️ قواعد صارمة:
#   - لا يتم وضع أي Secret في هذا الملف (بند 62، 143).
#   - كل الأسرار تُحط عبر:
#       wrangler secret put <NAME>
#   - هذا الملف آمن للـ commit في Git.
#
# ⚠️ قبل النشر:
#   1. حدّد Worker name (يجب أن يكون فريد).
#   2. اضبط الـ compatibility_date.
#   3. أضف الـ Secrets المطلوبة:
#      - FIREBASE_SERVICE_ACCOUNT (JSON)
#      - JWT_SECRET
#      - AI_API_KEY
#      - AI_PROVIDER
# ============================================================

# ============================================================
# الإعدادات الأساسية
# ============================================================

name = "am-ismail-platform-api"
main = "index.js"

# ============================================================
# Compatibility
# ------------------------------------------------------------
# تاريخ الإصدار يحدد الميزات المتاحة + behavior.
# يُحدَّد مرة واحدة ويُحدَّث سنويًا فقط.
# ============================================================

compatibility_date = "2024-09-23"

# Node.js compatibility — مطلوب لبعض المكتبات
compatibility_flags = ["nodejs_compat"]

# ============================================================
# Account / Zone (اختياري)
# ------------------------------------------------------------
# يتم تحديدها من خلال wrangler login أو CLOUDFLARE_ACCOUNT_ID env var.
# ============================================================

# account_id = "your-account-id-here"
# zone_id = "your-zone-id-here"

# ============================================================
# Workers.dev (رابط فرعي مجاني)
# ------------------------------------------------------------
# true = يُتيح أيضًا الوصول عبر am-ismail-platform-api.<account>.workers.dev
# (للفحص فقط؛ الواجهة تستخدم https://mrismailemad.com عبر الـ Route أدناه).
# ============================================================

workers_dev = true

# ============================================================
# Routes / Custom Domain
# ------------------------------------------------------------
# مسارات /api/* على mrismailemad.com تُوجَّه إلى هذا الـ Worker،
# وباقي المسارات تخدمها الواجهة الثابتة (Firebase Hosting).
# بدون هذا الـ Route يصل /api/* إلى Firebase فيعيد index.html.
#
# ⚠️ يتطلب أن يكون نطاق mrismailemad.com (Zone) في نفس حساب
#    Cloudflare المستخدم في "wrangler deploy"، وأن يكون سجل DNS
#    الخاص بالنطاق في وضع Proxied.
routes = [
  { pattern = "mrismailemad.com/api/*", zone_name = "mrismailemad.com" }
]
# ============================================================

# ============================================================
# Variables (بيانات عامة — ليست Secrets)
# ------------------------------------------------------------
# كل البيانات هنا آمنة للعرض.
# ممنوع: API Keys، Tokens، Passwords.
# ============================================================

[vars]
# بيئة التشغيل: "production" أو "development"
ENVIRONMENT = "production"

# رقم إصدار الـ Worker
WORKER_VERSION = "1.0.0"

# النطاقات المسموح لها بالوصول (CORS) — إنتاج فقط.
# ⚠️ لا تضف عناوين localhost هنا. للتطوير المحلي استخدم ملف
#    worker/.dev.vars (غير مرفوع إلى Git ولا يُنشر) — انظر .dev.vars.example.
# ملاحظة: CORS لا يغني عن التحقق من التوكن والصلاحيات داخل الـ Worker.
ALLOWED_ORIGINS = "https://mrismailemad.com,https://manasty-e422d.web.app,https://manasty-e422d.firebaseapp.com"

# مدة الجلسة (بالأيام)
JWT_EXPIRY_STUDENT_DAYS = "7"
JWT_EXPIRY_ADMIN_HOURS = "1"
JWT_REFRESH_EXPIRY_DAYS = "30"

# حدود استخدام AI
AI_DAILY_LIMIT_STUDENT = "20"

# النسبة الافتراضية للنجاح في الاختبارات
DEFAULT_PASSING_PERCENT = "50"

# مدة Cache للبيانات الثابتة (بالثواني)
CACHE_TTL_SECONDS = "300"

# ============================================================
# KV Namespaces (اختياري — للتخزين المؤقت / Rate Limiting)
# ------------------------------------------------------------
# KV مفيد لـ:
#   - Rate Limiting.
#   - Cache للبيانات الثابتة.
#   - Logs مؤقتة.
#
# ⚠️ قبل الاستخدام:
#   1. أنشئ الـ namespace:
#       wrangler kv:namespace create CACHE_KV
#   2. افتح الـ output واستبدل الـ id.
# ============================================================

# [[kv_namespaces]]
# binding = "CACHE_KV"
# id = "your-kv-namespace-id-here"
# preview_id = "your-preview-kv-namespace-id-here"

# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "your-rate-limit-kv-id-here"
# preview_id = "your-preview-rate-limit-kv-id-here"

# ============================================================
# Durable Objects (اختياري — للعمليات الذرّية)
# ------------------------------------------------------------
# مفيد لـ:
#   - Code Activation Race Protection (بند 186).
#   - Exam Attempt Race Protection (بند 187).
#   - AI Rate Limit (بند 188).
#
# ⚠️ Durable Objects تحتاج خطة Workers Paid.
# ============================================================

# [[durable_objects.bindings]]
# name = "CODE_LOCKS"
# class_name = "CodeLock"

# [[durable_objects.bindings]]
# name = "EXAM_LOCKS"
# class_name = "ExamLock"

# [durable_objects]
# bindings = ["CODE_LOCKS", "EXAM_LOCKS"]

# ============================================================
# R2 Buckets (اختياري — غير مستخدم حاليًا)
# ------------------------------------------------------------
# الوثيقة قالت: مفيش Firebase Storage للمحتوى الطبيعي (بند 3).
# مفيش رفع فيديوهات.
# ============================================================

# ============================================================
# Secrets المطلوبة
# ------------------------------------------------------------
# ⚠️ لا تُحفظ في هذا الملف.
#
# تُضاف بأمر واحد لكل Secret:
#
#   wrangler secret put FIREBASE_SERVICE_ACCOUNT
#   wrangler secret put JWT_SECRET
#   wrangler secret put AI_API_KEY
#   wrangler secret put AI_PROVIDER
#
# بعد الإضافة، تصبح متاحة في Worker عبر:
#   env.FIREBASE_SERVICE_ACCOUNT
#   env.JWT_SECRET
#   env.AI_API_KEY
#   env.AI_PROVIDER
#
# قائمة Secrets كاملة:
#   1. FIREBASE_SERVICE_ACCOUNT — JSON (من Firebase Console → Service Accounts)
#   2. JWT_SECRET — نص عشوائي طويل (32+ حرف)
#   3. AI_API_KEY — من مزود AI المختار
#   4. AI_PROVIDER — "openai" / "gemini" / "claude" / إلخ
# ============================================================

# ============================================================
# Observability
# ------------------------------------------------------------
# تفعيل Logs والقياسات.
# ============================================================

[observability]
enabled = true

# ============================================================
# Build
# ============================================================
# Build
# ------------------------------------------------------------
# مفيش build step — الكود JS مباشر.
# ============================================================

# ============================================================
# النشر
# ------------------------------------------------------------
# الخطوات الكاملة (الأسرار، النشر، الفحص بعد النشر) في /README.md.
# بعد "wrangler deploy" يُفحص: https://mrismailemad.com/api/ping
# ولا حاجة لتعديل WORKER_URL في /env.js (قيمته الحالية صحيحة).
# ============================================================
